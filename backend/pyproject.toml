[project]
name = "lda-api"
version = "0.1.0"
description = "Layer 4 backend: FastAPI over Postgres. Deliberately has no HTTP-client dependency — runtime LDA API calls are structurally impossible."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.35",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lda_api"]
