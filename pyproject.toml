[project]
name = "lda-visualizer"
version = "0.1.0"
description = "LDA longitudinal lobbying network visualizer — workspace root"
requires-python = ">=3.12"
# The serving deps live here as well as in requirements.txt: Vercel's Git builds
# resolve dependencies from pyproject.toml/uv.lock when present, and the workspace
# root would otherwise install nothing for the serverless function.
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.5",
]

[tool.uv.workspace]
members = ["ingest", "pipeline", "backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["ingest/tests", "pipeline/tests", "backend/tests"]
asyncio_mode = "auto"
markers = [
    "realdb: assertions against the production database (skipped when data absent)",
]
